name: BackChatHelper
main: com.example.backchathelper.BackChatHelper
version: 1.1.3
api-version: 1.20
description: Network-wide ignores, PMs, and nicks via Redis
commands:
  ignore:
    description: Toggle ignoring a player
    usage: /ignore <player>
  msg:
    description: Send a private message
    usage: /msg <player> <message>
    aliases: [m, tell, whisper]
  r:
    description: Reply to last private message
    usage: /r <message>
    aliases: [reply]
  nick:
    description: Set or reset your nickname (supports MiniMessage gradients)
    usage: /nick <nickname> | /nick reset
